name: Publish to npm

# Publishes the package to npm with build provenance. n8n requires provenance
# for verified community nodes submitted on/after 2026-05-01, so the package
# MUST be published from CI (not a laptop). Triggered by publishing a GitHub
# Release. Add an NPM_TOKEN secret (an npm automation/granular token).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      # Runs n8n's verification scanner against the exact tarball that will be
      # published. Native dep (isolated-vm) compiles fine on Linux runners but
      # not on a plain Windows dev box. Non-blocking: review its output in the
      # CI log before submitting to the Creator Portal — the same checks gate
      # verified-node approval.
      - name: Scan for verification issues
        continue-on-error: true
        run: |
          npm pack
          npx --yes @n8n/scan-community-package ./$(npm pack --dry-run --json | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d)[0].filename))")

      # --provenance + id-token:write generates the signed provenance statement
      # tying this package to this repo + commit.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
